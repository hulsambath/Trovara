name: Release to Play Store (prod)

# Triggered by pushing a version tag (v1.0.0) or manually.
# Builds the prod AAB via `shorebird release` (so the store build is OTA-patchable)
# and uploads it to the chosen Play track.
#
# Required repository secrets (see scripts/setup_ci_secrets.sh):
#   ANDROID_KEYSTORE_BASE64      base64 of the prod upload keystore (.jks)
#   ANDROID_KEYSTORE_PROPERTIES  contents of prod keystore.properties (storeFile=upload.jks)
#   TROVARA_PROD_CONFIG_JSON     contents of configs/trovara_prod.json
#   FIREBASE_OPTIONS_PROD_DART   contents of lib/firebase_options/prod.dart
#   PLAY_SERVICE_ACCOUNT_JSON    Google Play publishing service account JSON
#   SHOREBIRD_TOKEN              CI token from the Shorebird console

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: release-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Restore signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          # android/app/build.gradle.kts resolves ../../credentials/android/trovara/<flavor>
          # relative to the android/ directory, i.e. a sibling of the repo checkout.
          CRED_DIR="${GITHUB_WORKSPACE}/../credentials/android/trovara/prod"
          mkdir -p "${CRED_DIR}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${CRED_DIR}/upload.jks"
          printf '%s' "${KEYSTORE_PROPERTIES}" > "${CRED_DIR}/keystore.properties"

      - name: Restore build-time configs
        env:
          PROD_CONFIG: ${{ secrets.TROVARA_PROD_CONFIG_JSON }}
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_PROD_DART }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_PROD_JSON }}
        run: |
          set -euo pipefail
          mkdir -p configs android/app/src/prod
          printf '%s' "${PROD_CONFIG}" > configs/trovara_prod.json
          printf '%s' "${GOOGLE_SERVICES}" > android/app/src/prod/google-services.json
          # stub only writes staging.dart (imported by main_staging.dart, must compile)
          bash ./scripts/create_firebase_stub.sh
          printf '%s' "${FIREBASE_OPTIONS}" > lib/firebase_options/prod.dart

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Shorebird release (builds prod AAB)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android \
            --flavor prod \
            --target lib/main_prod.dart \
            --flutter-version=3.41.4 \
            -- --dart-define-from-file=configs/trovara_prod.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trovara-prod-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.trovara.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
